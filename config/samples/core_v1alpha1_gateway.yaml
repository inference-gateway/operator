apiVersion: core.inference-gateway.com/v1alpha1
kind: Gateway
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: gateway-sample
spec:
  environment: production
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    enabled: true
    config:
      minReplicas: 2
      maxReplicas: 10
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70
        - type: Resource
          resource:
            name: memory
            target:
              type: Utilization
              averageUtilization: 80
        # A per-pod custom metric needs a metrics adapter, such as
        # prometheus-adapter, that serves it. Without one the HPA never scales down.
        # - type: Pods
        #   pods:
        #     metric:
        #       name: http_requests_per_second
        #     target:
        #       type: AverageValue
        #       averageValue: "100"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 60
  providers:
    - name: openai
      env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-secret
              key: api_key
