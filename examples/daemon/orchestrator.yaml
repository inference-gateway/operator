apiVersion: core.inference-gateway.com/v1alpha1
kind: Orchestrator
metadata:
  name: daemon
  namespace: orchestrators
spec:
  image: ghcr.io/inference-gateway/cli:latest
  daemon:
    binding:
      tokenSecretRef:
        name: daemon-binding
        key: token
      tls:
        secretName: daemon-binding-tls
      # Optional: metadata copied verbatim onto the daemon-binding Service for
      # other controllers, for example a VPN operator or external-dns.
      # service:
      #   annotations:
      #     tailscale.com/expose: "true"
      #   labels:
      #     tier: edge
  gateway:
    url: http://inference-gateway.inference-gateway.svc.cluster.local:8080
  agent:
    model: deepseek/deepseek-v4-pro
