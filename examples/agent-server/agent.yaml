---
apiVersion: v1
kind: Namespace
metadata:
  name: agents
  labels:
    inference-gateway.com/managed: "true"
---
apiVersion: core.inference-gateway.com/v1alpha1
kind: Agent
metadata:
  name: google-calendar-agent
  namespace: agents
spec:
  image: ghcr.io/inference-gateway/google-calendar-agent:latest
  agent:
    llm:
      # Service of the Gateway CR from ../gateway-minimal/ (named simple-gateway).
      baseURL: "http://simple-gateway.inference-gateway.svc.cluster.local:8080/v1"
      model: "openai/gpt-4o"
      # Emitted as A2A_AGENT_CLIENT_API_KEY. The Secret must live in this
      # Agent's namespace (agents) - secret refs are not cross-namespace.
      apiKeySecretRef:
        name: agent-llm-secret
        key: OPENAI_API_KEY
  telemetry:
    enabled: true
    traces:
      exporter:
        otlp:
          endpoint: "http://otel-collector.observability.svc.cluster.local:4318"
          protocol: "http/protobuf"
    metrics:
      exporter:
        prometheus:
          port: 9464
  env:
    - name: GOOGLE_CALENDAR_MOCK_MODE
      value: "true"
    - name: A2A_AGENT_URL
      value: "http://google-calendar-agent.agents.svc.cluster.local:8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-llm-secret
  namespace: agents
type: Opaque
stringData:
  OPENAI_API_KEY: ""
