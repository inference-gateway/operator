---
apiVersion: v1
kind: Namespace
metadata:
  name: agents
  labels:
    inference-gateway.com/managed: "true"
---
apiVersion: core.inference-gateway.com/v1alpha1
kind: Agent
metadata:
  name: google-calendar-agent
  namespace: agents
spec:
  image: ghcr.io/inference-gateway/google-calendar-agent:latest
  card:
    # Emitted as A2A_AGENT_URL and reported in /.well-known/agent-card.json.
    # Without it the agent advertises its in-cluster Service URL
    # (http://google-calendar-agent.agents.svc.cluster.local:8080).
    url: "https://calendar-agent.example.com"
  # The agent's MCP client, emitted as A2A_MCP_* env vars. The agent discovers the
  # servers' tools and exposes them to its LLM. This is the client side - the MCP
  # CR in ../mcp-server/ deploys the server it connects to.
  mcp:
    enabled: true # A2A_MCP_ENABLED
    servers: # A2A_MCP_SERVERS (comma-separated base URLs)
      - "http://mcp-memory-server-service.mcp.svc.cluster.local:8080"
    endpoint: "/mcp" # A2A_MCP_ENDPOINT, appended to each server URL
    refreshInterval: "5m" # A2A_MCP_REFRESH_INTERVAL, tool re-discovery
    dialTimeout: "30s" # A2A_MCP_DIAL_TIMEOUT
    callTimeout: "30s" # A2A_MCP_CALL_TIMEOUT
    maxRetries: 5 # A2A_MCP_MAX_RETRIES, 0 retries forever
    retryInterval: "2s" # A2A_MCP_RETRY_INTERVAL, initial backoff
    retryMaxInterval: "30s" # A2A_MCP_RETRY_MAX_INTERVAL, backoff cap
  agent:
    llm:
      # Service of the Gateway CR from ../gateway-minimal/ (named simple-gateway).
      baseURL: "http://simple-gateway.inference-gateway.svc.cluster.local:8080/v1"
      model: "openai/gpt-4o"
      apiKeySecretRef:
        name: agent-llm-secret
        key: OPENAI_API_KEY
  env:
    - name: GOOGLE_CALENDAR_MOCK_MODE
      value: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-llm-secret
  namespace: agents
type: Opaque
stringData:
  OPENAI_API_KEY: ""
