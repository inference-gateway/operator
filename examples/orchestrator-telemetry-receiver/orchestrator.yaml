---
apiVersion: v1
kind: Namespace
metadata:
  name: orchestrator
---
apiVersion: core.inference-gateway.com/v1alpha1
kind: Orchestrator
metadata:
  name: orchestrator
  namespace: orchestrator
spec:
  image: ghcr.io/inference-gateway/cli:latest
  gateway:
    url: http://inference-gateway.inference-gateway.svc.cluster.local:8080
  agent:
    model: deepseek/deepseek-v4-flash
  telemetry:
    # Required - with telemetry disabled the receiver address is not passed to
    # the daemon even though the Service below is still created.
    enabled: true
    # An OTLP/HTTP receiver inside the orchestrator pod. The operator sets
    # INFER_TELEMETRY_RECEIVER_ADDRESS=0.0.0.0:<port>, adds the container port and
    # creates the `orchestrator-receiver` Service (port name otlp-http).
    receiver:
      enabled: true
      port: 4318
---
apiVersion: v1
kind: Namespace
metadata:
  name: inference-gateway
  labels:
    inference-gateway.com/managed: "true"
---
# A Gateway that pushes its traces to the orchestrator's receiver Service.
apiVersion: core.inference-gateway.com/v1alpha1
kind: Gateway
metadata:
  name: inference-gateway
  namespace: inference-gateway
spec:
  environment: development
  telemetry:
    enabled: true
    traces:
      exporter:
        otlp:
          endpoint: "http://orchestrator-receiver.orchestrator.svc.cluster.local:4318"
          protocol: "http/protobuf"
  providers:
    - name: DeepSeek
      env:
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: inference-gateway-providers-secret
              key: DEEPSEEK_API_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: inference-gateway-providers-secret
  namespace: inference-gateway
type: Opaque
stringData:
  DEEPSEEK_API_KEY: ""
