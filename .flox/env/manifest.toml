schema-version = "1.19.0"

[install]
go.pkg-path = "go"
go.version = "1.27.3"
go.pkg-group = "go"
go-task.pkg-path = "go-task"
go-task.version = "3.53.1"
ctlptl.pkg-path = "ctlptl"
ctlptl.version = "0.9.6"
k3d.pkg-path = "k3d"
k3d.version = "5.9.0"
kubectl.pkg-path = "kubectl"
kubectl.version = "^1.37.2"
golangci-lint.pkg-path = "golangci-lint"
golangci-lint.version = "^2.15.0"
golangci-lint.pkg-group = "go"
gh.pkg-path = "gh"
gh.version = "2.103.3"
kubebuilder.pkg-path = "kubebuilder"
kubebuilder.version = "4.15.0"
kubernetes-code-generator.pkg-path = "kubernetes-code-generator"
kubernetes-code-generator.version = "0.25.4"
kustomize.pkg-path = "kustomize"
kustomize.version = "5.8.3"
prettier.pkg-path = "prettier"
prettier.version = "^3.9.10"
infer.flake = "github:inference-gateway/cli/v0.231.1"
claude-code.pkg-path = "claude-code"
claude-code.version = "^2.1.321"
claude-code.pkg-group = "claude-code"
codex.pkg-path = "codex"
codex.version = "^0.167.1"
codex.pkg-group = "codex"

[hook]
on-activate = """
  export GOENV="$FLOX_ENV_CACHE/goenv"
  go get .
"""
