version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
    - gci
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - prefix(github.com/onsi)
        - default
        - prefix(github.com/inference-gateway/)
        - prefix(github.com/inference-gateway/operator)
  exclusions:
    generated: lax

linters:
  default: none
  enable:
    - dupl
    - importas
    - errcheck
    - copyloopvar
    - ginkgolinter
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

  settings:
    importas:
      no-unaliased: true
      alias:
        - pkg: github.com/inference-gateway/operator/api/v1alpha1
          alias: corev1alpha1
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: apierrors
        - pkg: k8s.io/apimachinery/pkg/util/runtime
          alias: utilruntime
        - pkg: k8s.io/client-go/kubernetes/scheme
          alias: clientgoscheme
        - pkg: sigs.k8s.io/controller-runtime
          alias: ctrl
        - pkg: sigs.k8s.io/gateway-api/apis/v1
          alias: gwapiv1
        - pkg: '^k8s\.io/api/([a-z]+)/(v[0-9][a-z0-9]*)$'
          alias: '${1}${2}'
        - pkg: '^k8s\.io/apimachinery/pkg/apis/([a-z]+)/(v[0-9][a-z0-9]*)$'
          alias: '${1}${2}'
        - pkg: '^[^/]+\.[^/]+/.*?([a-z][a-z0-9]*)(?:-go)?(?:\.v[0-9]+)?(?:/v[0-9][0-9.]*)?$'
          alias: '$1'
    revive:
      rules:
        - name: comment-spacings
    lll:
      line-length: 250
